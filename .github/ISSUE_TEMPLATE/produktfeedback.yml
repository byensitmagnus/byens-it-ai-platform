name: Produktfeedback
description: Beskriv en fejl eller en konkret opgave produktet bør løse
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: "Del ingen persondata, kundedokumenter, samtaler, API-nøgler eller cookies. Sikkerhedsproblemer: brug den private kontaktvej i SECURITY.md."
  - type: textarea
    id: task
    attributes:
      label: Opgave og forventet resultat
      description: Hvad forsøgte du at gøre?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Faktisk resultat og reproduktion
      description: Brug kun anonymiserede eksempler.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Side, version og browser
